kind = "web"
previewPath = "/"
title = "Rexora Technologies"
description = "A premium corporate website for Rexora Technologies, a global technology and professional services company helping businesses build, scale, and transform through software, cloud, data, AI, consulting, and specialized expertise."
version = "1.0.0"
id = "artifacts/rexora-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22509

[services.development]
run = "pnpm --filter @workspace/rexora-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rexora-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/rexora-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22509"
BASE_PATH = "/"
